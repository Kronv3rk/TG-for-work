name: Android Release

on:
  push:
    branches:
      - main
    paths:
      - "release/v1.11.0.request"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: android-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version and prevent duplicate releases
        id: meta
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$INPUT_TAG"
          elif [[ "$REF_TYPE" == "branch" && "$REF_NAME" == "main" ]]; then
            TAG="$(cat release/v1.11.0.request)"
          else
            TAG="$REF_NAME"
          fi

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag format" >&2
            exit 1
          fi

          VERSION_NAME="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          if [[ "v$VERSION_NAME" != "$TAG" || -z "$VERSION_CODE" ]]; then
            echo "::error::Tag $TAG does not match Gradle versionName ($VERSION_NAME)" >&2
            exit 1
          fi

          git fetch origin main --no-tags
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Only commits on main may be released" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Published APKs are immutable." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "sdkmanager was not found" >&2
            exit 1
          fi

          set +o pipefail
          yes | "$SDKMANAGER" --licenses >/dev/null
          set -o pipefail

          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"

      - name: Configure release signing
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/signing"
          KEYSTORE_FILE="$RUNNER_TEMP/signing/release.jks"

          # Count how many of the four signing secrets are present so a partial
          # setup fails loudly instead of silently signing with the fallback key.
          SECRET_COUNT=0
          for value in "$ANDROID_KEYSTORE_BASE64" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS" "$ANDROID_KEY_PASSWORD"; do
            [[ -n "$value" ]] && SECRET_COUNT=$((SECRET_COUNT + 1))
          done

          if [[ "$SECRET_COUNT" -eq 4 ]]; then
            echo "Signing with key from repository secrets."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_FILE"
            STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
            KEY_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
          elif [[ "$SECRET_COUNT" -ne 0 ]]; then
            echo "Partial release signing secrets detected ($SECRET_COUNT/4 set)." >&2
            echo "Set all of ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD, or none to use the committed key." >&2
            exit 1
          else
            echo "Signing with committed fallback key (app/signing/release-keystore.b64)."
            base64 --decode < app/signing/release-keystore.b64 > "$KEYSTORE_FILE"
            STORE_PASSWORD="LeYIC8VM6c8hG7QUrItSRBYB3Pyu4gDf"
            KEY_ALIAS="tgforwork"
            KEY_PASSWORD="LeYIC8VM6c8hG7QUrItSRBYB3Pyu4gDf"
          fi

          {
            echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build APK
        id: build
        shell: bash
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          chmod +x ./gradlew

          ./gradlew :app:testDebugUnitTest :app:assembleRelease --no-daemon --stacktrace
          APK_PATH="$(find app/build/outputs/apk/release -name '*.apk' ! -name '*-unsigned.apk' | head -n 1)"
          APK_KIND="release-signed"

          if [[ -z "$APK_PATH" || ! -f "$APK_PATH" ]]; then
            echo "Signed APK was not produced" >&2
            exit 1
          fi

          ASSET_NAME="TG-for-work-${TAG}-${APK_KIND}.apk"
          ASSET_PATH="$RUNNER_TEMP/$ASSET_NAME"
          cp "$APK_PATH" "$ASSET_PATH"

          echo "asset_name=$ASSET_NAME" >> "$GITHUB_OUTPUT"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_kind=$APK_KIND" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature and existing-installation compatibility
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          APK="${{ steps.build.outputs.asset_path }}"
          APKSIGNER="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/new-signing.txt"

          mkdir -p "$RUNNER_TEMP/previous"
          gh release download v1.10.1 --pattern '*-release-signed.apk' --dir "$RUNNER_TEMP/previous"
          PREVIOUS="$(find "$RUNNER_TEMP/previous" -maxdepth 1 -name '*.apk' | head -n 1)"
          if [[ -z "$PREVIOUS" || ! -f "$PREVIOUS" ]]; then
            echo "::error::Previous release APK is missing" >&2
            exit 1
          fi
          "$APKSIGNER" verify --verbose --print-certs "$PREVIOUS" > "$RUNNER_TEMP/old-signing.txt"
          NEW_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/new-signing.txt" | head -n 1)"
          OLD_CERT="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/old-signing.txt" | head -n 1)"
          if [[ -z "$NEW_CERT" || -z "$OLD_CERT" || "$NEW_CERT" != "$OLD_CERT" ]]; then
            echo "::error::Release signing certificate does not match v1.10.1. Existing users cannot update." >&2
            exit 1
          fi
          (cd "$RUNNER_TEMP" && sha256sum "$(basename "$APK")") > "$APK.sha256"
          echo "APK signature verified and compatible with v1.10.1"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.asset_name }}
          path: |
            ${{ steps.build.outputs.asset_path }}
            ${{ steps.build.outputs.asset_path }}.sha256
          if-no-files-found: error

      - name: Publish verified GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.meta.outputs.tag }}"
          APK="${{ steps.build.outputs.asset_path }}"
          NOTES="$RUNNER_TEMP/release-notes.md"
          cat > "$NOTES" <<'EOF'
          TG-for-work 1.11.0

          - Перенесена защита Fake TLS от повторных ClientHello и добавлен пул соединений собственного Cloudflare Worker.
          - Добавлен экспериментальный Cloudflare HTTP/2 для медиатрафика: параллельные POST /api, TLS/ALPN и общий пул соединений.
          - Добавлено ограниченное восстановление зависших MTProto-запросов, до трёх повторов и подавление поздних дублирующих ответов.
          - Ограничены очереди и память HTTP/2-каналов; ошибки Cloudflare передаются в формате MTProto.
          - HTTP/2 выключен по умолчанию и требует включённого Cloudflare. При неудачном preflight используются прежние маршруты.
          - Сохранены прежние applicationId, формат tg://proxy, пользовательские настройки и сертификат подписи.

          HTTP/2 проверен на локальном TLS/ALPN-сервере. Проверка на реальных Cloudflare /api и физических Android-устройствах остаётся отдельным этапом; прирост скорости не гарантируется.
          EOF
          gh release create "$TAG" "$APK" "$APK.sha256" \
            --title "TG-for-work $TAG" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA"
