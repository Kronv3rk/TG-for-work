name: Android Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (v2.0.0 or later)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      previous_tag: ${{ steps.meta.outputs.previous_tag }}
      version_code: ${{ steps.meta.outputs.version_code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release
        id: meta
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[2-9][0-9]*\.[0-9]+\.[0-9]+$ || "$TAG" =~ ^v[1-9][0-9]+\.[0-9]+\.[0-9]+$ ]]
          VERSION="$(sed -n 's/^[[:space:]]*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          CODE="$(sed -n 's/^[[:space:]]*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$TAG" == "v$VERSION" && "$CODE" =~ ^[0-9]+$ && "$CODE" -gt 31 ]]
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$GITHUB_SHA" ]]
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release already exists"
            exit 1
          fi
          test -s "release-notes/$TAG.md"
          PREVIOUS="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$PREVIOUS" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$PREVIOUS" == v1.* ]]; then
            [[ "$PREVIOUS" == v1.11.6 && "$TAG" == v2.0.0 ]]
          else
            [[ "$TAG" != "$PREVIOUS" && "$(printf '%s\n%s\n' "$TAG" "$PREVIOUS" | sort -V | tail -1)" == "$TAG" ]]
          fi
          printf 'tag=%s\nprevious_tag=%s\nversion_code=%s\n' "$TAG" "$PREVIOUS" "$CODE" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-disabled: true
      - name: Install Android SDK
        shell: bash
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Test and build unsigned release
        shell: bash
        env:
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p "$RUNNER_TEMP/unsigned"
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/unsigned/app.apk"
          cp "release-notes/$TAG.md" "$RUNNER_TEMP/unsigned/notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release
          path: ${{ runner.temp }}/unsigned/
          retention-days: 1
          if-no-files-found: error

  sign:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-release
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-release
          path: ${{ runner.temp }}/unsigned
      - name: Install Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;35.0.0"
      - name: Check previous release
        id: previous
        shell: bash
        env:
          PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          DIR="$(mktemp -d)"
          trap 'rm -rf "$DIR"' EXIT
          gh release download "$PREVIOUS_TAG" --repo "$GITHUB_REPOSITORY" --pattern '*-release-signed.apk' --dir "$DIR"
          shopt -s nullglob
          APKS=("$DIR"/*.apk)
          [[ "${#APKS[@]}" -eq 1 ]]
          "$TOOLS/apksigner" verify --print-certs "${APKS[0]}" > "$DIR/certs.txt"
          mapfile -t CERTS < <(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' "$DIR/certs.txt")
          [[ "${#CERTS[@]}" -eq 1 && "${CERTS[0]}" =~ ^[a-fA-F0-9]{64}$ ]]
          OLD_META="$("$TOOLS/aapt" dump badging "${APKS[0]}" | sed -n '1p')"
          NEW_META="$("$TOOLS/aapt" dump badging "$RUNNER_TEMP/unsigned/app.apk" | sed -n '1p')"
          [[ "$OLD_META" == "package: name='com.flowseal.tgwsproxy'"* ]]
          [[ "$NEW_META" == "package: name='com.flowseal.tgwsproxy'"* ]]
          OLD_CODE="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$OLD_META")"
          NEW_CODE="$(sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" <<< "$NEW_META")"
          [[ "$OLD_CODE" =~ ^[0-9]+$ && "$NEW_CODE" == "$VERSION_CODE" && "$NEW_CODE" -gt "$OLD_CODE" ]]
          printf 'certificate=%s\n' "${CERTS[0],,}" >> "$GITHUB_OUTPUT"
      - name: Sign and verify the pinned certificate
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          KEYSTORE_B64: ${{ secrets.TG_RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.TG_RELEASE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.TG_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.TG_RELEASE_KEY_PASSWORD }}
          EXPECTED_CERT: ${{ vars.TG_RELEASE_CERT_SHA256 }}
          PREVIOUS_CERT: ${{ steps.previous.outputs.certificate }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD EXPECTED_CERT; do
            [[ -n "${!name}" ]] || { echo "::error::Release signing configuration incomplete ($name)"; exit 1; }
          done
          EXPECTED_CERT="${EXPECTED_CERT,,}"
          [[ "$EXPECTED_CERT" =~ ^[a-f0-9]{64}$ && "$PREVIOUS_CERT" =~ ^[a-f0-9]{64}$ ]]
          if [[ "$TAG" == v2.0.0 && "$PREVIOUS_TAG" == v1.11.6 ]]; then
            [[ "$EXPECTED_CERT" != "$PREVIOUS_CERT" ]]
          else
            [[ "$EXPECTED_CERT" == "$PREVIOUS_CERT" ]]
          fi
          WORK="$(mktemp -d)"
          trap 'rm -rf "$WORK"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$WORK/release.jks"
          unset KEYSTORE_B64
          TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/35.0.0"
          OUT="$RUNNER_TEMP/signed"
          mkdir -p "$OUT"
          APK="$OUT/TG-for-work-$TAG-release-signed.apk"
          "$TOOLS/zipalign" -f -P 16 4 "$RUNNER_TEMP/unsigned/app.apk" "$WORK/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$WORK/release.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --out "$APK" "$WORK/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" > "$WORK/certs.txt"
          mapfile -t CERTS < <(sed -n 's/^Signer #[0-9]* certificate SHA-256 digest: //p' "$WORK/certs.txt")
          [[ "${#CERTS[@]}" -eq 1 && "${CERTS[0],,}" == "$EXPECTED_CERT" ]]
          (cd "$OUT" && sha256sum "$(basename "$APK")" > "$(basename "$APK").sha256")
          printf '%s\n' "$EXPECTED_CERT" > "$OUT/release-certificate.sha256"
          cp "$RUNNER_TEMP/unsigned/notes.md" "$OUT/notes.md"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed/
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: [build, sign]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-release
          path: ${{ runner.temp }}/signed
      - name: Publish signed APK and checksums
        shell: bash
        env:
          TAG: ${{ needs.build.outputs.tag }}
          PREVIOUS_TAG: ${{ needs.build.outputs.previous_tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')" == "$GITHUB_SHA" ]]
          [[ "$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" == "$PREVIOUS_TAG" ]]
          cd "$RUNNER_TEMP/signed"
          APK="TG-for-work-$TAG-release-signed.apk"
          sha256sum --check "$APK.sha256"
          gh release create "$TAG" "$APK" "$APK.sha256" release-certificate.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "TG-for-work $TAG" --notes-file notes.md
