name: HTTP/2 acceptance lab

on:
  workflow_dispatch:
    inputs:
      h2_host:
        description: "Optional public Cloudflare HTTP/2 hostname (DNS name only, no URL/port)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: h2-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-protocol:
    name: Local TLS/ALPN HTTP/2 fault injection
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Run deterministic TLS/ALPN acceptance tests
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.flowseal.tgwsproxy.proxy.CfH2TransportTest' --tests 'com.flowseal.tgwsproxy.proxy.CloudflareH2PreflightTest'
      - name: Run acceptance report parser tests
        run: python3 -m unittest discover -s scripts/tests -p 'test_*h2_preflight.py' -v
      - name: Upload local acceptance results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-local-acceptance
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

  public-endpoint-preflight:
    name: Explicit real-host TLS/ALPN preflight (no MTProto)
    runs-on: ubuntu-latest
    needs: local-protocol
    if: ${{ inputs.h2_host != '' }}
    timeout-minutes: 20
    env:
      TG_H2_PROBE_HOST: ${{ inputs.h2_host }}
      TG_H2_PROBE_JSON: acceptance-report/okhttp.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install upstream-compatible HTTP/2 client
        run: python -m pip install 'httpx[http2]==0.28.1'
      - name: Read-only upstream httpx preflight (HEAD /api)
        run: python scripts/h2_preflight.py --host "$TG_H2_PROBE_HOST" --output acceptance-report/httpx.json
      - name: Read-only OkHttp preflight (HEAD /api)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest --tests 'com.flowseal.tgwsproxy.proxy.CloudflareH2PreflightTest'
      - name: Compare two actual TLS/ALPN negotiation results
        run: |
          python scripts/compare_h2_preflight.py \
            --httpx acceptance-report/httpx.json \
            --okhttp acceptance-report/okhttp.json \
            --output acceptance-report/comparison.json
      - name: Upload results, including failed attempts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: h2-public-preflight
          path: |
            acceptance-report/
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
